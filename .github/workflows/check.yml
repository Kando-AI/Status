# checker.run:定时探测 → 数据 commit → 状态变化时同工作流触发部署(docs/DESIGN.md §17、ADR-005)
name: checker.run
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: checker
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status_changed: ${{ steps.run.outputs.status_changed }}
    steps:
      - uses: actions/checkout@v4
      # 检测数据存专用 data 分支(ADR-007):检出到工作区 data/;首轮分支不存在时由下方提交步骤创建
      - name: Checkout data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run checks
        id: run
        run: npx tsx packages/checker/src/index.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          # 配置里 headers 用 $NAME 引用的探测密钥,须在此注入同名 Secret,例如:
          # API_TOKEN: ${{ secrets.API_TOKEN }}
      - name: Commit data to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: data
        run: |
          # 首轮无 data 分支:上方 checkout 失败可能残留半初始化的 .git(HEAD 不在 data),
          # 统一用 symbolic-ref 把 HEAD 定到 data 分支(保留工作区),push 用显式 refspec(ADR-007)
          if [ ! -d .git ]; then
            git init
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git symbolic-ref HEAD refs/heads/data
          git config user.name "butus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "checks: $(date -u +%FT%TZ)"
            # push 竞态:rebase 重试 1 次,仍失败则放弃本轮(下轮自愈,docs/DESIGN.md §16)
            git push origin HEAD:refs/heads/data || { git pull --rebase origin data && git push origin HEAD:refs/heads/data; } || echo "::warning::data push skipped this round"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.status_changed == 'true'
    permissions:
      contents: read
      issues: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
